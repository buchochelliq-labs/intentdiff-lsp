# Generic LSP client crate (#100, A2.5 Surface S2): an intentdiff-AGNOSTIC Language Server
# Protocol client, ported from src/intentdiff/lsp/client.py. Deliberately reusable by other
# projects — nothing in here may know about SemanticNode or the intentdiff engine (the
# enricher layer lives in the core). Extracted to its own repo at the split (#82).
# Standalone package (excluded from the root workspace) so its [patch] section applies.
#
# Layers: the sans-IO Content-Length framing codec + JSON-RPC message helpers with the #88
# reader caps (slice 1), and the tokio client — stdio subprocess with the #88 env hardening,
# TCP, pending-request map, initialize handshake, hover, shutdown ladder (slice 2). Tests
# use an in-process duplex peer — NO network.

[package]
name = "intentdiff-lsp-client"
version = "0.1.0"
edition = "2021"
publish = false
description = "Generic LSP 3.17 client: Content-Length framing + JSON-RPC 2.0 over stdio/TCP"
license = "MIT"

[dependencies]
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "test-util"] }

[patch.crates-io]
quote = { path = "../../patches/quote" }
zmij = { path = "../../patches/zmij" }
serde_core = { path = "../../patches/serde_core" }
