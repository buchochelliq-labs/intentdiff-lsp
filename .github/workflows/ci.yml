name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build + tests (both crates)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust 1.93.0
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: 1.93.0
      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
      # Phase D: the git dep on the private intentdiff-core needs an org token wired.
      - name: lsp-client tests
        run: cargo test --manifest-path crates/lsp-client/Cargo.toml
      - name: lsp-server build + tests
        run: |
          cargo build --release --manifest-path crates/lsp-server/Cargo.toml
          cargo test --manifest-path crates/lsp-server/Cargo.toml
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
